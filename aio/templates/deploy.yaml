---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n9e-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: ~
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    component: center
  name: nightingale
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      component: center
  serviceName: nightingale-center
  template:
    metadata:
      labels:
        component: center
    spec:
      containers:
        - command:
            - sh
            - -ce
            - echo |base64 -d|sh
          env:
            - name: GIN_MODE
              value: release
            - name: TZ
              value: Asia/Shanghai
          image: {{ .Values.image }}
          name: nightingale
          ports:
            - containerPort: 17000
          readinessProbe:
            httpGet:
              port: 17000
              path: /v1/n9e/heartbeat
          volumeMounts:
            - mountPath: /n9e/etc/config.toml
              name: config
              subPath: toml
            - mountPath: /app/data
              name: data
          workingDir: /app
      enableServiceLinks: false
      shareProcessNamespace: true
      volumes:
        - persistentVolumeClaim:
            claimName: n9e-data
          name: data
        - configMap:
            name: n9e-config
            items:
              - key: config.toml
                path: toml
          name: config